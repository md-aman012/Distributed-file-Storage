# render.yaml — Render Blueprint for the backend web service
# Docs: https://render.com/docs/blueprint-spec
#
# How to use:
#   1. Push this repository to GitHub.
#   2. Go to render.com → New → Blueprint.
#   3. Connect your GitHub repo — Render will detect this file and
#      auto-configure the service.
#   4. After creation, go to the service's Environment tab and add
#      your real secret values (DATABASE_URL, JWT_SECRET, AWS_*, CORS_ORIGIN).

services:
  - type: web
    name: distributed-file-storage-api
    runtime: node
    region: singapore       # pick the region closest to your users
    plan: free              # upgrade to paid for always-on

    rootDir: backend        # the backend folder inside the monorepo

    buildCommand: npm install
    startCommand: node server.js

    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      # ── Add the following secrets in the Render dashboard ──────
      # DATABASE_URL
      # JWT_SECRET
      # AWS_ACCESS_KEY_ID
      # AWS_SECRET_ACCESS_KEY
      # AWS_REGION
      # AWS_S3_BUCKET_NAME
      # CORS_ORIGIN        ← your Vercel frontend URL
